<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng nhập</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth"><main class="card"><h1>Đăng nhập</h1><p class="error" th:if="${param.error}">Email hoặc mật khẩu không đúng.</p><p class="success" th:if="${param.logout}">Bạn đã đăng xuất.</p><form th:action="@{/login}" method="post"><label>Email</label><input type="email" name="email" required autofocus><label>Mật khẩu</label><input type="password" name="password" required><button type="submit">Đăng nhập</button></form></main></body></html>
