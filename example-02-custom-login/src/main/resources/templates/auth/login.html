<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng nhập</title></head><body><h2>Đăng nhập</h2><p th:if="${param.error}" style="color:red">Username/email hoặc password không đúng</p><p th:if="${param.logout}" style="color:green">Bạn đã đăng xuất</p><form th:action="@{/login}" method="post"><label>Username hoặc Email</label><input type="text" name="username" required><label>Password</label><input type="password" name="password" required><button type="submit">Đăng nhập</button></form></body></html>
