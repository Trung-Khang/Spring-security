<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><header th:fragment="header"><a th:href="@{/}">UTEShop</a><div th:if="${#authorization.expression('isAuthenticated()')}"><img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.svg'}" width="40" height="40" alt="Avatar"><span th:text="${#authentication.principal.fullName}">User</span><span th:text="|(${#authentication.principal.username})|">(user)</span><span th:text="${#authentication.principal.email}">email</span><span th:text="${#authentication.principal.role}">ROLE_USER</span><form th:action="@{/logout}" method="post" style="display:inline"><button type="submit">Đăng xuất</button></form></div><a th:unless="${#authorization.expression('isAuthenticated()')}" th:href="@{/login}">Đăng nhập</a></header></body></html>
