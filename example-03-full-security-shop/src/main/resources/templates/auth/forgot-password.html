<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head><title>Quên mật khẩu</title></head>
<body><section layout:fragment="content" class="form-card">
    <h1>Quên mật khẩu</h1><p class="alert error" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <label>Email tài khoản</label><input th:field="*{email}" type="email" required><button class="button full" type="submit">Gửi OTP</button>
    </form>
</section></body></html>
