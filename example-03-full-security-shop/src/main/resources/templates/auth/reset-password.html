<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head><title>Đặt lại mật khẩu</title></head>
<body><section layout:fragment="content" class="form-card">
    <h1>Đặt lại mật khẩu</h1><p class="alert error" th:if="${error}" th:text="${error}"></p><p class="alert success" th:if="${success}" th:text="${success}"></p>
    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <label>Email</label><input th:field="*{email}" type="email" required><label>OTP 6 số</label><input th:field="*{otp}" required>
        <label>Mật khẩu mới</label><input th:field="*{newPassword}" type="password" required><label>Xác nhận mật khẩu</label><input th:field="*{confirmPassword}" type="password" required>
        <button class="button full" type="submit">Cập nhật mật khẩu</button>
    </form>
</section></body></html>
