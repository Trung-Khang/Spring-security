<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head><title>Xác nhận OTP</title></head>
<body><section layout:fragment="content" class="form-card">
    <h1>Xác nhận email</h1><p class="alert error" th:if="${error}" th:text="${error}"></p><p class="alert success" th:if="${success}" th:text="${success}"></p>
    <form th:action="@{/verify-otp}" th:object="${otpVerifyDTO}" method="post">
        <label>Email</label><input th:field="*{email}" type="email" required><label>OTP 6 số</label><input th:field="*{otp}" inputmode="numeric" pattern="[0-9]{6}" required>
        <button class="button full" type="submit">Xác nhận OTP</button>
    </form>
    <form th:action="@{/resend-register-otp}" method="post"><input type="hidden" name="email" th:value="${otpVerifyDTO.email}"><button class="button secondary full" type="submit">Gửi lại OTP</button></form>
</section></body></html>
