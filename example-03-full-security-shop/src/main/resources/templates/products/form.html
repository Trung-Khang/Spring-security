<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head><title>Sản phẩm</title></head>
<body><section layout:fragment="content" class="form-card">
    <h1 th:text="${mode == 'create' ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}">Sản phẩm</h1>
    <form th:action="${mode == 'create'} ? @{/products} : @{/products/{id}(id=${productDTO.id})}" th:object="${productDTO}" method="post" enctype="multipart/form-data">
        <label>Tên</label><input th:field="*{name}" required><label>Mô tả</label><textarea th:field="*{description}" rows="4"></textarea>
        <label>Giá</label><input th:field="*{price}" type="number" min="0" step="0.01" required><label>Ảnh</label><input name="image" type="file" accept="image/*">
        <img class="preview" th:if="${productDTO.imageUrl != null}" th:src="${productDTO.imageUrl}" alt="Ảnh hiện tại">
        <button class="button" type="submit">Lưu sản phẩm</button><a class="button secondary" th:href="@{/products}">Hủy</a>
    </form>
</section></body></html>
