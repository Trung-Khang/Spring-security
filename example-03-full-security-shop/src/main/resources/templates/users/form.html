<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head><title>Thông tin người dùng</title></head>
<body><section layout:fragment="content" class="form-card">
    <h1 th:text="${mode == 'create' ? 'Thêm người dùng' : 'Cập nhật người dùng'}">Người dùng</h1><p class="alert error" th:if="${error}" th:text="${error}"></p>
    <form th:action="${mode == 'create'} ? @{/users} : @{/users/{id}(id=${userDTO.id})}" th:object="${userDTO}" method="post">
        <label>Username</label><input th:field="*{username}" required><label>Email</label><input th:field="*{email}" type="email" required><label>Họ tên</label><input th:field="*{fullName}" required>
        <label th:if="${mode == 'create'}">Mật khẩu</label><input th:if="${mode == 'create'}" th:field="*{password}" type="password" minlength="8" required>
        <label>Role</label><select th:field="*{roleName}"><option value="ROLE_USER">ROLE_USER</option><option value="ROLE_ADMIN">ROLE_ADMIN</option></select>
        <label class="check"><input th:field="*{enabled}" type="checkbox"> Đang hoạt động</label>
        <button class="button" type="submit">Lưu</button><a class="button secondary" th:href="@{/users}">Hủy</a>
    </form>
</section></body></html>
