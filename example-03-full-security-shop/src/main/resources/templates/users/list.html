<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head><title>Người dùng</title></head>
<body><section layout:fragment="content">
    <div class="page-heading"><h1>Người dùng</h1><a class="button" th:href="@{/users/new}">Thêm người dùng</a></div>
    <form class="search" th:action="@{/users}" method="get"><input name="keyword" th:value="${keyword}" placeholder="Tìm username, tên hoặc email"><button class="button" type="submit">Tìm</button></form>
    <div class="table-wrap"><table><thead><tr><th>Username</th><th>Họ tên</th><th>Email</th><th>Role</th><th>Trạng thái</th><th>Sản phẩm</th><th></th></tr></thead><tbody>
    <tr th:each="user : ${users.content}"><td th:text="${user.username}"></td><td th:text="${user.fullName}"></td><td th:text="${user.email}"></td><td th:text="${user.roleName}"></td><td th:text="${user.enabled ? 'Hoạt động' : 'Đã khóa'}"></td><td th:text="${user.productCount}"></td>
        <td class="row-actions"><a th:href="@{/users/{id}/edit(id=${user.id})}">Sửa</a><form th:action="@{/users/{id}/enabled(id=${user.id})}" method="post"><input type="hidden" name="enabled" th:value="${!user.enabled}"><button class="link-button" type="submit" th:text="${user.enabled ? 'Khóa' : 'Mở'}"></button></form><form th:action="@{/users/{id}/delete(id=${user.id})}" method="post"><button class="link-button danger" type="submit">Xóa</button></form></td>
    </tr></tbody></table></div>
    <nav class="pagination"><a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number - 1},keyword=${keyword})}">Trước</a><span th:text="|Trang ${users.number + 1} / ${users.totalPages}|">Trang</span><a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number + 1},keyword=${keyword})}">Sau</a></nav>
</section></body></html>
